<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abdoulaye COULIBALY — BTS SIO SISR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #faf6ef;
      --bg2:     #f2e9d8;
      --bg3:     #ede0ca;
      --card:    #fffdf8;
      --card2:   #fdf5e8;
      --border:  #e4d5bc;
      --border2: #cdb898;
      --accent:  #7a4f2e;
      --accent2: #c4883a;
      --accent3: #9b6535;
      --text:    #1c1206;
      --text2:   #2e1e0a;
      --muted:   #7a6650;
      --muted2:  #a08c72;
      --grad:    linear-gradient(135deg, #7a4f2e, #c4883a);
      --grad2:   linear-gradient(135deg, #9b6535, #d4a050);
      --shadow:  0 4px 28px rgba(122,79,46,.09);
      --shadow2: 0 12px 48px rgba(122,79,46,.14);
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 3px; }

    /* ── NAV ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 6%;
      background: rgba(250,246,239,.92); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-size: 1.3rem; font-weight: 900; letter-spacing: -.03em;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: .85rem; font-weight: 500; transition: color .2s; }
    .nav-links a:hover { color: var(--accent); }
    .nav-badge {
      font-size: .72rem; padding: .28rem .85rem; border-radius: 999px;
      background: linear-gradient(135deg,#7a4f2e18,#c4883a18);
      border: 1px solid var(--border2); color: var(--accent3); font-weight: 700;
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh; display: flex; align-items: center;
      padding: 0 6%; padding-top: 80px; position: relative; overflow: hidden;
    }
    .hero-orb {
      position: absolute; border-radius: 50%; filter: blur(110px); pointer-events: none; opacity: .18;
    }
    .orb1 { width: 600px; height: 600px; background: #c4883a; top: -150px; right: -100px; }
    .orb2 { width: 350px; height: 350px; background: #7a4f2e; bottom: -80px; left: -80px; }
    .hero-inner {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; gap: 4rem; position: relative; z-index: 1;
    }
    .hero-text { max-width: 640px; }
    .hero-tag {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--card); border: 1px solid var(--border2);
      padding: .35rem .95rem; border-radius: 999px;
      font-size: .77rem; color: var(--muted); font-weight: 600; margin-bottom: 1.8rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .hero-tag .dot { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
    .hero h1 {
      font-size: clamp(2.4rem, 5.5vw, 4.2rem); font-weight: 900;
      line-height: 1.08; letter-spacing: -.04em; margin-bottom: 1rem;
    }
    .hero h1 .name {
      background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      display: block; min-height: 1.2em;
    }
    .cursor {
      display: inline-block;
      background: var(--grad2); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: blink-cursor .7s step-end infinite;
      font-weight: 300;
    }
    @keyframes blink-cursor { 0%,100%{opacity:1} 50%{opacity:0} }
    .hero-role {
      font-family: 'JetBrains Mono', monospace; font-size: .92rem;
      color: var(--accent2); font-weight: 600; margin-bottom: 1.2rem;
      letter-spacing: .02em;
    }
    .hero p { color: var(--muted); font-size: .95rem; line-height: 1.8; max-width: 520px; margin-bottom: 2.5rem; }
    .hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn-fill {
      padding: .8rem 1.8rem; border-radius: 12px; border: none; cursor: pointer;
      background: var(--grad); color: #fff; font-weight: 700; font-size: .9rem;
      text-decoration: none; display: inline-block; transition: transform .2s, box-shadow .2s;
    }
    .btn-fill:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(122,79,46,.35); }
    .btn-outline {
      padding: .8rem 1.8rem; border-radius: 12px;
      border: 1.5px solid var(--border2); background: transparent;
      color: var(--text2); font-weight: 600; font-size: .9rem;
      text-decoration: none; display: inline-block; transition: all .2s; cursor: pointer;
    }
    .btn-outline:hover { background: var(--bg3); border-color: var(--accent); }

    /* hero stats */
    .hero-stats { display: flex; gap: 2.5rem; margin-top: 2.8rem; padding-top: 2.2rem; border-top: 1px solid var(--border); }
    .stat-num { font-size: 2rem; font-weight: 900; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-lbl { font-size: .78rem; color: var(--muted); font-weight: 500; margin-top: .15rem; }

    /* hero card */
    .hero-card {
      flex-shrink: 0; width: 300px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 28px; padding: 2.2rem; box-shadow: var(--shadow2);
    }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--grad); display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; margin: 0 auto 1.4rem;
      border: 3px solid var(--border);
    }
    .hcard-name { text-align: center; font-size: 1.05rem; font-weight: 800; margin-bottom: .2rem; }
    .hcard-role { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.4; }
    .hcard-divider { height: 1px; background: var(--border); margin-bottom: 1.3rem; }
    .hcard-row { display: flex; align-items: center; gap: .65rem; font-size: .83rem; color: var(--muted2); margin-bottom: .65rem; }
    .hcard-row .ico { font-size: .95rem; }
    .hcard-row strong { color: var(--text2); }
    .hcard-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid var(--border); }
    .q-tag {
      font-size: .72rem; padding: .25rem .65rem; border-radius: 999px;
      background: linear-gradient(135deg,#7a4f2e12,#c4883a12);
      border: 1px solid var(--border); color: var(--accent3); font-weight: 600;
    }

    /* scroll hint */
    .hero-scroll {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: .4rem; z-index: 1;
    }
    .scroll-line { width: 1px; height: 44px; background: linear-gradient(to bottom, var(--accent2), transparent); animation: grow 2s infinite; }
    @keyframes grow { 0%{transform:scaleY(0);transform-origin:top} 50%{transform:scaleY(1);transform-origin:top} 51%{transform:scaleY(1);transform-origin:bottom} 100%{transform:scaleY(0);transform-origin:bottom} }
    .scroll-txt { font-size: .65rem; color: var(--muted2); letter-spacing: .12em; font-family: 'JetBrains Mono',monospace; }

    /* ── SECTION COMMONS ── */
    .section { padding: 7rem 6%; }
    .section-alt { background: var(--bg2); }
    .section-alt2 { background: var(--bg3); }
    .sec-label {
      font-size: .7rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
      color: var(--accent2); margin-bottom: .55rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .sec-title { font-size: clamp(1.7rem, 3.5vw, 2.4rem); font-weight: 800; letter-spacing: -.03em; margin-bottom: .5rem; }
    .sec-sub { color: var(--muted); font-size: .93rem; margin-bottom: 3.5rem; }
    .center { text-align: center; }

    /* ── À PROPOS ── */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
    .about-text p { color: var(--muted); font-size: .95rem; line-height: 1.85; margin-bottom: 1.5rem; }
    .about-qualities { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.5rem; }
    .qual {
      font-size: .82rem; padding: .35rem .9rem; border-radius: 999px;
      background: var(--card); border: 1.5px solid var(--border2); color: var(--accent3);
      font-weight: 600; transition: all .2s;
    }
    .qual:hover { background: var(--bg3); }
    .about-right { display: flex; flex-direction: column; gap: 1rem; }
    .info-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 1.5rem;
      box-shadow: var(--shadow); transition: border-color .3s;
    }
    .info-card:hover { border-color: var(--border2); }
    .info-card-title { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted2); margin-bottom: 1rem; font-family: 'JetBrains Mono',monospace; }
    .info-row { display: flex; align-items: center; gap: .65rem; font-size: .88rem; color: var(--muted2); margin-bottom: .55rem; }
    .info-row:last-child { margin-bottom: 0; }
    .info-row .i { font-size: 1rem; }
    .info-row strong { color: var(--text2); font-weight: 600; }
    .lang-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: .7rem; }
    .lang-row:last-child { margin-bottom: 0; }
    .lang-name { font-size: .88rem; font-weight: 600; color: var(--text2); }
    .lang-badge {
      font-size: .72rem; padding: .2rem .6rem; border-radius: 999px;
      background: linear-gradient(135deg,#7a4f2e18,#c4883a18);
      border: 1px solid var(--border2); color: var(--accent3); font-weight: 700;
    }

    /* ── PARCOURS ── */
    .company-wrap { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr .9fr; gap: 2rem; align-items: stretch; }
    .company-main, .company-side {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 22px; padding: 2rem; box-shadow: var(--shadow);
    }
    .company-kicker {
      font-family: 'JetBrains Mono', monospace; font-size: .72rem; font-weight: 800;
      color: var(--accent2); letter-spacing: .16em; text-transform: uppercase; margin-bottom: .7rem;
    }
    .company-main h3 { font-size: 1.35rem; font-weight: 900; margin-bottom: 1rem; letter-spacing: -.02em; }
    .company-main p { color: var(--muted); font-size: .9rem; line-height: 1.8; margin-bottom: 1rem; }
    .company-values { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.2rem; }
    .company-value {
      font-size: .78rem; padding: .3rem .75rem; border-radius: 999px;
      background: linear-gradient(135deg,#7a4f2e10,#c4883a10);
      border: 1px solid var(--border); color: var(--accent3); font-weight: 700;
    }
    .company-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
    .company-stat {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; padding: 1rem;
    }
    .company-stat strong { display: block; font-size: 1.3rem; color: var(--accent); margin-bottom: .25rem; }
    .company-stat span { color: var(--muted); font-size: .78rem; line-height: 1.45; }
    .company-role {
      margin-top: 1rem; padding: 1rem; border-radius: 16px;
      background: linear-gradient(135deg,#7a4f2e0d,#c4883a12);
      border: 1px solid var(--border2);
    }
    .company-role h4 { font-size: .9rem; font-weight: 850; margin-bottom: .5rem; }
    .company-role ul { list-style: none; display: grid; gap: .45rem; }
    .company-role li { position: relative; padding-left: 1rem; color: var(--muted); font-size: .84rem; line-height: 1.55; }
    .company-role li::before { content: '›'; position: absolute; left: 0; color: var(--accent2); font-weight: 900; }

    .timeline { position: relative; max-width: 860px; margin: 0 auto; }
    .timeline::before {
      content: ''; position: absolute; left: 22px; top: 0; bottom: 0;
      width: 2px; background: linear-gradient(to bottom, var(--accent), var(--accent2), transparent);
    }
    .tl-item { display: flex; gap: 2rem; margin-bottom: 2.5rem; position: relative; }
    .tl-dot {
      flex-shrink: 0; width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid var(--accent2); background: var(--card);
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem; z-index: 1;
      box-shadow: 0 0 0 4px var(--bg2);
    }
    .tl-card {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow);
      transition: border-color .3s, transform .3s;
    }
    .tl-card:hover { border-color: var(--border2); transform: translateX(4px); }
    .tl-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .3rem; flex-wrap: wrap; gap: .5rem; }
    .tl-date {
      font-size: .72rem; font-weight: 700; padding: .22rem .7rem; border-radius: 999px;
      background: var(--grad); color: #fff; font-family: 'JetBrains Mono',monospace;
    }
    .tl-type {
      font-size: .72rem; font-weight: 600; padding: .22rem .65rem; border-radius: 999px;
      border: 1px solid var(--border2); color: var(--muted2); background: var(--bg2);
    }
    .tl-title { font-size: 1.05rem; font-weight: 800; margin-bottom: .2rem; color: var(--text); }
    .tl-org { font-size: .88rem; color: var(--accent2); font-weight: 600; margin-bottom: .8rem; }
    .tl-missions { list-style: none; }
    .tl-missions li {
      font-size: .86rem; color: var(--muted); padding: .3rem 0 .3rem 1rem;
      border-bottom: 1px solid var(--border); position: relative; line-height: 1.5;
    }
    .tl-missions li:last-child { border-bottom: none; }
    .tl-missions li::before { content: '▸'; position: absolute; left: 0; color: var(--accent2); }
    .tl-tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
    .tl-tag {
      font-size: .73rem; padding: .22rem .65rem; border-radius: 999px;
      background: linear-gradient(135deg,#7a4f2e0d,#c4883a0d);
      border: 1px solid var(--border); color: var(--accent3); font-weight: 500;
    }

    /* ── COMPÉTENCES ── */
    .skills-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 1.5rem; max-width: 1120px; margin: 0 auto; justify-content: center;
    }
    .skill-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 22px; padding: 1.8rem; box-shadow: var(--shadow);
      transition: border-color .3s, transform .3s;
    }
    .skill-card:hover { border-color: var(--accent2); transform: translateY(-4px); box-shadow: var(--shadow2); }
    .skill-icon {
      width: 50px; height: 50px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 1rem;
    }
    .skill-card h3 { font-size: 1rem; font-weight: 800; margin-bottom: .35rem; }
    .skill-card > p { color: var(--muted); font-size: .85rem; line-height: 1.6; margin-bottom: 1.3rem; }
    .slist { list-style: none; display: flex; flex-direction: column; gap: .5rem; }
    .srow { display: flex; align-items: center; justify-content: space-between; }
    .sname { font-size: .84rem; color: var(--muted2); font-weight: 500; }
    .sbar-wrap { width: 90px; height: 4px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
    .sbar { height: 100%; border-radius: 999px; background: var(--grad); }

    /* ── ÉPREUVES BTS ── */
    .epreuves-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .ep-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 22px; padding: 2rem; box-shadow: var(--shadow);
      transition: border-color .3s, transform .3s;
    }
    .ep-card:hover { border-color: var(--accent2); transform: translateY(-4px); }
    .ep-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.2rem; }
    .ep-ref {
      font-family: 'JetBrains Mono', monospace; font-size: .75rem; font-weight: 700;
      padding: .3rem .7rem; border-radius: 8px;
      background: var(--grad); color: #fff;
    }
    .ep-coeff {
      font-size: .75rem; font-weight: 700; color: var(--accent3);
      background: linear-gradient(135deg,#7a4f2e12,#c4883a12);
      border: 1px solid var(--border2); padding: .25rem .65rem; border-radius: 8px;
    }
    .ep-card h3 { font-size: .98rem; font-weight: 800; margin-bottom: .5rem; line-height: 1.4; }
    .ep-card p { color: var(--muted); font-size: .85rem; line-height: 1.6; margin-bottom: 1.2rem; }
    .ep-meta { display: flex; gap: .5rem; flex-wrap: wrap; }
    .ep-pill {
      font-size: .73rem; padding: .22rem .65rem; border-radius: 999px;
      background: var(--bg2); border: 1px solid var(--border); color: var(--muted2); font-weight: 500;
    }

    /* ── PROJETS ── */
    .certs-wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 1.4rem; }
    .cert-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 22px; padding: 1.6rem; box-shadow: var(--shadow);
      transition: border-color .3s, transform .3s, box-shadow .3s;
    }
    .cert-card:hover { border-color: var(--accent2); transform: translateY(-4px); box-shadow: var(--shadow2); }
    .cert-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .cert-title-row { display: flex; align-items: center; gap: .9rem; min-width: 0; }
    .cert-icon {
      flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#7a4f2e12,#c4883a14);
      border: 1px solid var(--border); color: var(--accent);
    }
    .cert-icon svg { width: 27px; height: 27px; }
    .cert-title { font-size: 1.02rem; font-weight: 850; line-height: 1.35; color: var(--text); }
    .cert-status {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: .35rem;
      border-radius: 999px; padding: .28rem .65rem;
      background: #16a34a12; border: 1px solid #16a34a35; color: #15803d;
      font-size: .72rem; font-weight: 800;
    }
    .cert-meta { display: flex; gap: .8rem; flex-wrap: wrap; color: var(--muted2); font-size: .82rem; margin-bottom: 1rem; }
    .cert-meta span { display: inline-flex; align-items: center; gap: .35rem; }
    .cert-summary { color: var(--muted); font-size: .88rem; line-height: 1.75; margin-bottom: 1.1rem; }
    .cert-panel {
      background: linear-gradient(135deg,#7a4f2e08,#c4883a08);
      border: 1px solid var(--border2); border-radius: 14px;
      padding: 1rem; margin-bottom: 1rem;
    }
    .cert-panel-title {
      font-family: 'JetBrains Mono', monospace; font-size: .68rem; font-weight: 800;
      letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
      margin-bottom: .75rem;
    }
    .cert-panel p { color: var(--muted); font-size: .83rem; line-height: 1.65; margin-bottom: .45rem; }
    .cert-panel p:last-child { margin-bottom: 0; }
    .cert-tags { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1rem; }
    .cert-tag {
      font-family: 'JetBrains Mono', monospace; font-size: .72rem; font-weight: 700;
      padding: .25rem .55rem; border-radius: 7px;
      background: #2f80ed10; border: 1px solid #2f80ed30; color: #1f6fd1;
    }
    .cert-actions { display: flex; gap: .6rem; flex-wrap: wrap; padding-top: 1rem; border-top: 1px solid var(--border); }
    .cert-btn {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .55rem .9rem; border-radius: 10px; text-decoration: none;
      font-size: .82rem; font-weight: 800; transition: transform .2s, box-shadow .2s, background .2s;
    }
    .cert-btn svg { width: 15px; height: 15px; }
    .cert-btn-main { background: var(--grad); color: #fff; }
    .cert-btn-soft { background: var(--bg2); border: 1px solid var(--border); color: var(--text2); }
    .cert-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(122,79,46,.16); }

    .project-tabs { display: flex; justify-content: center; gap: .65rem; flex-wrap: wrap; margin: -1.2rem 0 2rem; }
    .project-tab {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .65rem 1rem; border-radius: 10px;
      border: 1.5px solid var(--border); background: var(--card);
      color: var(--muted); font-weight: 800; font-size: .84rem;

function useTypewriter(lines, { typeSpeed = 80, deleteSpeed = 45, pauseAfterType = 1800, pauseAfterDelete = 500 } = {}) {
  const [display, setDisplay] = React.useState('');
  const [lineIdx, setLineIdx] = React.useState(0);
  const [isDeleting, setIsDeleting] = React.useState(false);

  React.useEffect(() => {
    const current = lines[lineIdx];
    let timeout;
    if (!isDeleting) {
      if (display.length < current.length) {
        timeout = setTimeout(() => setDisplay(current.slice(0, display.length + 1)), typeSpeed);
      } else {
        timeout = setTimeout(() => setIsDeleting(true), pauseAfterType);
      }
    } else {
      if (display.length > 0) {
        timeout = setTimeout(() => setDisplay(display.slice(0, -1)), deleteSpeed);
      } else {
        setIsDeleting(false);
        setLineIdx((lineIdx + 1) % lines.length);
        timeout = setTimeout(() => {}, pauseAfterDelete);
      }
    }
    return () => clearTimeout(timeout);
  }, [display, isDeleting, lineIdx]);

  return display;
}
